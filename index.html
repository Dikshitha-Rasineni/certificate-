<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Certificate</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { background:#fff; min-height:100vh; }
  #pages canvas { display:block; width:100%; max-width:1000px; height:auto; margin:0 auto; }
  #frame { display:block; width:100vw; height:100vh; border:0; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<div id="pages"></div>
<iframe id="frame" title="Certificate" hidden></iframe>

<script>
  // The page stays blank until this file is uploaded next to index.html.
  const PDF_FILE = "certificate.pdf";
  const pdfUrl = PDF_FILE + "?v=" + Date.now();   // always fetch the latest upload

  async function pdfExists() {
    try {
      const r = await fetch(pdfUrl, { method: "HEAD", cache: "no-store" });
      return r.ok && (r.headers.get("content-type") || "").toLowerCase().includes("pdf");
    } catch { return false; }
  }

  function loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement("script");
      s.src = src; s.onload = res; s.onerror = rej;
      document.head.appendChild(s);
    });
  }

  async function renderWithPdfJs() {
    const base = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
    await loadScript(base + "pdf.min.js");
    pdfjsLib.GlobalWorkerOptions.workerSrc = base + "pdf.worker.min.js";
    const pdf = await pdfjsLib.getDocument({ url: pdfUrl }).promise;
    const container = document.getElementById("pages");
    const width = Math.min(window.innerWidth, 1000);
    const dpr = window.devicePixelRatio || 1;
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const vp = page.getViewport({ scale: (width / page.getViewport({ scale: 1 }).width) * dpr });
      const canvas = document.createElement("canvas");
      canvas.width = vp.width; canvas.height = vp.height;
      container.appendChild(canvas);
      await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
    }
  }

  (async () => {
    if (!(await pdfExists())) return;          // no PDF yet → page stays blank
    try {
      await renderWithPdfJs();                 // sharp rendering on phones
    } catch {
      document.getElementById("pages").innerHTML = "";
      const f = document.getElementById("frame");
      f.src = pdfUrl; f.hidden = false;        // fallback: browser's PDF viewer
    }
  })();
</script>
</body>
</html>
